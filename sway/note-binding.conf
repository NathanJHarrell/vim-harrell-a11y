# Drop these lines into your sway config (e.g. ~/charos/sway/config or
# ~/.config/sway/config). They wire up the left-anchored note drawer
# and bind Cmd/Super + N to summon a fresh quick-capture note.
#
# Requires:
#   - foot terminal (app_id-based window matching)
#   - the `note` script installed at ~/.local/bin/note (or update the path)
#   - $mod is your Sway modifier (Mod4 = Super = Cmd on Apple keyboards)

for_window [app_id="note"] floating enable, resize set 384 640, move position 0 80
bindsym $mod+n exec /home/nate/.local/bin/note-toggle
